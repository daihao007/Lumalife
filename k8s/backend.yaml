apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: lumalife
  labels:
    app.kubernetes.io/name: lumalife-backend
    app.kubernetes.io/part-of: lumalife
    app.kubernetes.io/version: main
spec:
  selector:
    app.kubernetes.io/name: lumalife-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lumalife
  labels:
    app.kubernetes.io/name: lumalife-backend
    app.kubernetes.io/part-of: lumalife
    app.kubernetes.io/version: main
spec:
  # The domain aggregate remains in-process while its durable state lives in
  # normalized MySQL tables. Recreate prevents an old in-memory snapshot from
  # overwriting writes made by a concurrent backend during a rolling update.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    # Keep exactly one writer until persistence uses operation/table-level
    # transactions that reload the latest state while holding the DB lock.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lumalife-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lumalife-backend
        app.kubernetes.io/part-of: lumalife
        app.kubernetes.io/version: main
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/daihao007/lumalife-backend:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_VERSION
              value: main
            - name: GIT_COMMIT
              value: unknown
            - name: SPRING_PROFILES_ACTIVE
              value: prod,remote
            - name: LUMALIFE_PERSISTENCE
              value: mysql
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: lumalife-mysql
                  key: database
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: lumalife-mysql
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumalife-mysql
                  key: password
            - name: LUMALIFE_INTERNAL_SERVICE_TOKEN
              value: compose-internal-token
            - name: IDENTITY_SERVICE_URL
              value: http://identity-service:8081
            - name: MERCHANT_SERVICE_URL
              value: http://merchant-service:8082
            - name: ORDER_SERVICE_URL
              value: http://order-service:8083
            - name: LUMALIFE_IDENTITY_REMOTE_ENABLED
              value: "true"
            - name: LUMALIFE_IDENTITY_BACKFILL_COMPLETED
              value: "true"
            - name: LUMALIFE_MERCHANT_REMOTE_ENABLED
              value: "true"
            - name: LUMALIFE_MERCHANT_BACKFILL_COMPLETED
              value: "true"
            - name: LUMALIFE_ORDER_REMOTE_ENABLED
              value: "true"
            - name: LUMALIFE_ORDER_BACKFILL_COMPLETED
              value: "true"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
