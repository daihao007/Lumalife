apiVersion: v1
kind: Service
metadata: {name: identity-service, namespace: lumalife}
spec: {selector: {app: identity-service}, ports: [{name: http, port: 8081, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: identity-service, namespace: lumalife}
spec:
  replicas: 1
  selector: {matchLabels: {app: identity-service}}
  template:
    metadata: {labels: {app: identity-service}}
    spec:
      # Services use cluster DNS. Disabling legacy service-link variables also
      # prevents *_SERVICE_PORT URI values from colliding with app settings.
      enableServiceLinks: false
      containers:
        - name: identity-service
          image: ghcr.io/daihao007/lumalife-identity-service:main
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8081}]
          env:
            - name: SERVICE_VERSION
              value: main
            - name: LUMALIFE_INTERNAL_SERVICE_TOKEN
              value: compose-internal-token
            - name: LUMALIFE_IDENTITY_STATE_FILE
              value: /app/data/identity-state.json
          volumeMounts:
            - name: identity-data
              mountPath: /app/data
          readinessProbe: {httpGet: {path: /actuator/health, port: http}, periodSeconds: 5}
      volumes:
        - name: identity-data
          persistentVolumeClaim: {claimName: identity-data}
---
apiVersion: v1
kind: Service
metadata: {name: merchant-service, namespace: lumalife}
spec: {selector: {app: merchant-service}, ports: [{name: http, port: 8082, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: merchant-service, namespace: lumalife}
spec:
  replicas: 1
  selector: {matchLabels: {app: merchant-service}}
  template:
    metadata: {labels: {app: merchant-service}}
    spec:
      enableServiceLinks: false
      containers:
        - name: merchant-service
          image: ghcr.io/daihao007/lumalife-merchant-service:main
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8082}]
          env:
            - name: SERVICE_VERSION
              value: main
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              valueFrom: {secretKeyRef: {name: lumalife-mysql, key: database}}
            - name: MYSQL_USER
              valueFrom: {secretKeyRef: {name: lumalife-mysql, key: username}}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: lumalife-mysql, key: password}}
            - name: LUMALIFE_INTERNAL_SERVICE_TOKEN
              value: compose-internal-token
          readinessProbe: {httpGet: {path: /actuator/health, port: http}, periodSeconds: 5}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: identity-data, namespace: lumalife}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
