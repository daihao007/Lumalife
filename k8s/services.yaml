apiVersion: v1
kind: Service
metadata: {name: identity-service, namespace: lumalife}
spec: {selector: {app: identity-service}, ports: [{name: http, port: 8081, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: identity-service, namespace: lumalife}
spec:
  replicas: 1
  selector: {matchLabels: {app: identity-service}}
  template:
    metadata: {labels: {app: identity-service}}
    spec:
      containers:
        - name: identity-service
          image: ghcr.io/daihao007/lumalife-identity-service:main
          ports: [{name: http, containerPort: 8081}]
          env: [{name: LUMALIFE_INTERNAL_SERVICE_TOKEN, value: compose-internal-token}]
          readinessProbe: {httpGet: {path: /actuator/health, port: http}, periodSeconds: 5}
---
