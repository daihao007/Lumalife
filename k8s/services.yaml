apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: lumalife
  labels: {app.kubernetes.io/name: identity-service, app.kubernetes.io/part-of: lumalife, app.kubernetes.io/version: main}
spec: {selector: {app.kubernetes.io/name: identity-service}, ports: [{name: http, port: 8081, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: lumalife
  labels: {app.kubernetes.io/name: identity-service, app.kubernetes.io/part-of: lumalife, app.kubernetes.io/version: main}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: identity-service}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: identity-service, app.kubernetes.io/part-of: lumalife, app.kubernetes.io/version: main}
    spec:
      # Services use cluster DNS. Disabling legacy service-link variables also
      # prevents *_SERVICE_PORT URI values from colliding with app settings.
      enableServiceLinks: false
      containers:
        - name: identity-service
          image: ghcr.io/daihao007/lumalife-identity-service:main
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8081}]
          env:
            - name: SERVICE_VERSION
              value: main
            - name: GIT_COMMIT
              value: unknown
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: LUMALIFE_INTERNAL_SERVICE_TOKEN
              value: compose-internal-token
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              valueFrom: {secretKeyRef: {name: lumalife-mysql, key: identity-database}}
            - name: MYSQL_USER
              valueFrom: {secretKeyRef: {name: lumalife-mysql, key: username}}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: lumalife-mysql, key: password}}
          volumeMounts:
            - name: identity-data
              mountPath: /app/data
          startupProbe: {httpGet: {path: /actuator/health/liveness, port: http}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: http}, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3}
      volumes:
        - name: identity-data
          persistentVolumeClaim: {claimName: identity-data}
---
