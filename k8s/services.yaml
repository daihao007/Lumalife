apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: lumalife
  labels:
    app: identity-service
    app.kubernetes.io/name: identity-service
    app.kubernetes.io/part-of: lumalife
spec:
  selector:
    app: identity-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: lumalife
  labels:
    app: identity-service
    app.kubernetes.io/name: identity-service
    app.kubernetes.io/part-of: lumalife
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
        app.kubernetes.io/name: identity-service
        app.kubernetes.io/part-of: lumalife
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity-service
          image: ghcr.io/daihao007/lumalife-identity-service:main
          imagePullPolicy: IfNotPresent
          workingDir: /app
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SERVICE_VERSION
              value: main
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: LUMALIFE_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lumalife-runtime
                  key: internal-service-token
                  optional: false
            - name: MYSQL_HOST
              value: mysql-identity
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: lumalife-mysql
                  key: identity-database
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: lumalife-mysql
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumalife-mysql
                  key: password
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: identity-data
              mountPath: /app/data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: identity-data
          persistentVolumeClaim:
            claimName: identity-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: identity-data
  namespace: lumalife
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
