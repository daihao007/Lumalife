apiVersion: v1
kind: ServiceAccount
metadata:
  name: lumalife-deployer
  namespace: lumalife
---
apiVersion: v1
kind: Secret
metadata:
  name: lumalife-deployer-token
  namespace: lumalife
  annotations:
    kubernetes.io/service-account.name: lumalife-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lumalife-deployer
  namespace: lumalife
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/attach"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lumalife-deployer
  namespace: lumalife
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lumalife-deployer
subjects:
  - kind: ServiceAccount
    name: lumalife-deployer
    namespace: lumalife
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lumalife-namespace-manager
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["lumalife"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lumalife-namespace-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lumalife-namespace-manager
subjects:
  - kind: ServiceAccount
    name: lumalife-deployer
    namespace: lumalife
