server:
  port: 8080
spring:
  application:
    name: lumalife-backend
  profiles:
    # Ordinary startup is deliberately remote and fail-closed. The legacy
    # implementation is available only through an explicit compatibility
    # profile: --spring.profiles.active=monolith (or compatibility).
    default: prod,remote
    group:
      compatibility:
        - monolith
management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
lumalife:
  internal:
    service-token: ${LUMALIFE_INTERNAL_SERVICE_TOKEN:}
  migration:
    identity:
      enabled: ${LUMALIFE_IDENTITY_REMOTE_ENABLED:true}
      backfill-completed: ${LUMALIFE_IDENTITY_BACKFILL_COMPLETED:true}
    merchant:
      enabled: ${LUMALIFE_MERCHANT_REMOTE_ENABLED:true}
      backfill-completed: ${LUMALIFE_MERCHANT_BACKFILL_COMPLETED:true}
    order:
      enabled: ${LUMALIFE_ORDER_REMOTE_ENABLED:true}
      backfill-completed: ${LUMALIFE_ORDER_BACKFILL_COMPLETED:true}
    assistant:
      enabled: ${LUMALIFE_ASSISTANT_REMOTE_ENABLED:true}
      backfill-completed: ${LUMALIFE_ASSISTANT_BACKFILL_COMPLETED:true}
  services:
    identity:
      base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
    merchant:
      base-url: ${MERCHANT_SERVICE_URL:http://localhost:8082}
    order:
      base-url: ${ORDER_SERVICE_URL:http://localhost:8083}
    assistant:
      base-url: ${ASSISTANT_SERVICE_URL:http://localhost:8084}
  persistence: ${LUMALIFE_PERSISTENCE:file}
  compatibility:
    store:
      enabled: ${LUMALIFE_COMPATIBILITY_STORE_ENABLED:false}
  state-file: ${LUMALIFE_STATE_FILE:./data/lumalife-state.json}
agnes:
  endpoint: https://apihub.agnes-ai.com/v1/chat/completions
  model: agnes-2.0-flash
  api-key: ${AGNES_API_KEY:}
