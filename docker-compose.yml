services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-life_assistant}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/database:ro
      - ./database/init/10-bootstrap.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP --host=127.0.0.1 --user=$$MYSQL_USER --database=$$MYSQL_DATABASE --batch --skip-column-names --execute='SELECT COUNT(*) >= 2 FROM schema_migration WHERE version IN (0x56303031, 0x56303032, 0x56303033)' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      LUMALIFE_PERSISTENCE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-life_assistant}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      LUMALIFE_INTERNAL_SERVICE_TOKEN: ${LUMALIFE_INTERNAL_SERVICE_TOKEN:-compose-internal-token}
      LUMALIFE_IDENTITY_REMOTE_ENABLED: ${LUMALIFE_IDENTITY_REMOTE_ENABLED:-false}
      LUMALIFE_IDENTITY_BACKFILL_COMPLETED: ${LUMALIFE_IDENTITY_BACKFILL_COMPLETED:-false}
      LUMALIFE_MERCHANT_REMOTE_ENABLED: ${LUMALIFE_MERCHANT_REMOTE_ENABLED:-true}
      LUMALIFE_MERCHANT_BACKFILL_COMPLETED: ${LUMALIFE_MERCHANT_BACKFILL_COMPLETED:-true}
      LUMALIFE_ORDER_REMOTE_ENABLED: ${LUMALIFE_ORDER_REMOTE_ENABLED:-true}
      LUMALIFE_ORDER_BACKFILL_COMPLETED: ${LUMALIFE_ORDER_BACKFILL_COMPLETED:-true}
      MERCHANT_SERVICE_URL: http://merchant-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      IDENTITY_SERVICE_URL: http://identity-service:8081
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      merchant-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  identity-service:
    build:
      context: ./services
      dockerfile: identity-service/Dockerfile
    environment:
      LUMALIFE_INTERNAL_SERVICE_TOKEN: ${LUMALIFE_INTERNAL_SERVICE_TOKEN:-compose-internal-token}
      LUMALIFE_IDENTITY_STATE_FILE: /app/data/identity-state.json
    volumes:
      - identity_data:/app/data
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
  merchant-service:
    build:
      context: ./services
      dockerfile: merchant-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LUMALIFE_INTERNAL_SERVICE_TOKEN: ${LUMALIFE_INTERNAL_SERVICE_TOKEN:-compose-internal-token}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-life_assistant}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
  order-service:
    build:
      context: ./services
      dockerfile: order-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LUMALIFE_INTERNAL_SERVICE_TOKEN: ${LUMALIFE_INTERNAL_SERVICE_TOKEN:-compose-internal-token}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-life_assistant}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  db-migrate:
    image: mysql:8.4
    profiles: ["db-tools"]
    environment: &database-tool-environment
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-life_assistant}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - ./database:/database:ro
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/database/bin/migrate.sh"]

  db-seed:
    image: mysql:8.4
    profiles: ["db-tools"]
    environment:
      <<: *database-tool-environment
      ALLOW_DEMO_SEED: "true"
    volumes:
      - ./database:/database:ro
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/database/bin/seed.sh"]

  db-clean:
    image: mysql:8.4
    profiles: ["db-tools"]
    environment:
      <<: *database-tool-environment
      ALLOW_DATABASE_CLEAN: "true"
    volumes:
      - ./database:/database:ro
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/database/bin/clean.sh"]

  db-verify:
    image: mysql:8.4
    profiles: ["db-tools"]
    environment:
      <<: *database-tool-environment
    volumes:
      - ./database:/database:ro
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/database/bin/verify.sh"]

  db-backfill-services:
    image: mysql:8.4
    profiles: ["db-tools"]
    environment:
      <<: *database-tool-environment
    volumes:
      - ./database:/database:ro
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/database/bin/backfill-services.sh"]

volumes:
  mysql_data:
  identity_data:
