services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-life_assistant}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=localhost --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  db-migrate:
    image: mysql:8.4
    profiles: ["db-tools"]
    environment: &database-tool-environment
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-life_assistant}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - ./database:/database:ro
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/database/bin/migrate.sh"]

  db-seed:
    image: mysql:8.4
    profiles: ["db-tools"]
    environment:
      <<: *database-tool-environment
      ALLOW_DEMO_SEED: "true"
    volumes:
      - ./database:/database:ro
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/database/bin/seed.sh"]

  db-clean:
    image: mysql:8.4
    profiles: ["db-tools"]
    environment:
      <<: *database-tool-environment
      ALLOW_DATABASE_CLEAN: "true"
    volumes:
      - ./database:/database:ro
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/database/bin/clean.sh"]

  db-verify:
    image: mysql:8.4
    profiles: ["db-tools"]
    environment:
      <<: *database-tool-environment
    volumes:
      - ./database:/database:ro
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/database/bin/verify.sh"]

volumes:
  mysql_data:
