services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lifeassist}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-life_assistant}
      MYSQL_USER: ${MYSQL_USER:-lifeassist}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lifeassist123}
    ports:
      - "3306:3306"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
