map $http_x_request_id $correlation_id {
    default $http_x_request_id;
    "" $request_id;
}

log_format json_combined escape=json '{"timestamp":"$time_iso8601","level":"INFO","service":"frontend","requestId":"$correlation_id","method":"$request_method","path":"$uri","status":$status,"durationSeconds":$request_time}';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        client_max_body_size 2m;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $correlation_id;
        proxy_set_header traceparent $http_traceparent;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $correlation_id;
        proxy_set_header traceparent $http_traceparent;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
