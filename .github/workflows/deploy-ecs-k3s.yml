name: Deploy ECS K3s

on:
  workflow_run:
    workflows:
      - Monolith CI
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: lumalife-ecs-k3s
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy validated image on Alibaba Cloud ECS
    if: >-
      vars.ECS_DEPLOY_ENABLED == 'true' &&
      vars.ECS_RUNNER_READY == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - lumalife-ecs
    timeout-minutes: 20
    environment: ecs-production
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      BUNDLE_PATH: ${{ github.workspace }}/.ecs-deploy-bundle-${{ github.run_id }}-${{ github.run_attempt }}
      KUBECONFIG: ${{ vars.ECS_KUBECONFIG_PATH }}

    steps:
      - name: Download validated deployment bundle
        uses: actions/download-artifact@v4
        with:
          name: ecs-deploy-bundle
          path: ${{ env.BUNDLE_PATH }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve immutable image tag and verify bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          image_tag="sha-${SOURCE_SHA:0:7}"
          echo "IMAGE_TAG=${image_tag}" >> "${GITHUB_ENV}"
          test "$(cat "${BUNDLE_PATH}/ecs-source-sha.txt")" = "${SOURCE_SHA}"
          test -f "${BUNDLE_PATH}/scripts/deploy-k8s.sh"
          test -f "${BUNDLE_PATH}/k8s/kustomization.yaml"
          test -f "${BUNDLE_PATH}/database/migrations/V001__baseline_schema.sql"
          test -n "${KUBECONFIG}"
          test -r "${KUBECONFIG}"
          kubectl cluster-info

      - name: Deploy versioned images and verify cluster health
        shell: bash
        working-directory: ${{ env.BUNDLE_PATH }}
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          test -n "${MYSQL_PASSWORD}"
          test -n "${MYSQL_ROOT_PASSWORD}"
          bash scripts/deploy-k8s.sh "${IMAGE_TAG}"

      - name: Publish deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Alibaba Cloud ECS K3s deployment"
            echo
            echo "- Image tag: \`${IMAGE_TAG:-unresolved}\`"
            echo "- Validated revision: \`${SOURCE_SHA}\`"
            echo "- Target: ECS-local self-hosted runner"
          } >> "${GITHUB_STEP_SUMMARY}"
