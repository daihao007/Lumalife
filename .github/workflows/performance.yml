name: Performance comparison

on:
  workflow_dispatch:
    inputs:
      requests:
        description: "正式请求数（每个版本、每次重复）"
        required: false
        default: "90"
      concurrency:
        description: "并发数"
        required: false
        default: "12"

permissions:
  contents: read

jobs:
  compare-compose-configurations:
    name: Compare monolith and microservices
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate isolated test credentials
        shell: bash
        run: |
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "MYSQL_DATABASE=life_assistant" >> "$GITHUB_ENV"
          echo "MYSQL_USER=lifeassist" >> "$GITHUB_ENV"
          echo "MYSQL_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Run the same workload in both modes
        shell: bash
        env:
          COMPOSE_PROJECT: lumalife-performance
          OUTPUT_DIR: 04_tests/performance/results/ci
          PERF_REQUESTS: ${{ inputs.requests }}
          PERF_CONCURRENCY: ${{ inputs.concurrency }}
          PERF_REPEATS: "3"
        run: |
          set -Eeuo pipefail
          docker compose -p lumalife-performance down --volumes --remove-orphans || true
          docker compose -p lumalife-performance up --detach --build --wait
          docker compose -p lumalife-performance --profile db-tools run --rm db-seed
          docker compose -p lumalife-performance --profile db-tools run --rm db-backfill-services
          bash 04_tests/performance/run-comparison.sh

      - name: Record performance artifact metadata
        if: always()
        shell: bash
        env:
          PERF_REQUESTS: ${{ inputs.requests }}
          PERF_CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          mkdir -p 04_tests/performance/results/ci
          {
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "requests_per_repeat=${PERF_REQUESTS}"
            echo "concurrency=${PERF_CONCURRENCY}"
            echo "repeats=3"
            echo "apis=merchant-search,categories,merchant-detail"
            echo "modes=microservices,monolith"
            echo "validator=04_tests/performance/validate-results.sh"
          } > 04_tests/performance/results/ci/run-metadata.txt

      - name: Validate performance matrix and artifacts
        if: always()
        shell: bash
        env:
          OUTPUT_DIR: 04_tests/performance/results/ci
          PERF_REQUESTS: ${{ inputs.requests }}
          PERF_CONCURRENCY: ${{ inputs.concurrency }}
          PERF_REQUIRE_STACK_RESOURCES: "true"
        run: bash 04_tests/performance/validate-results.sh "${OUTPUT_DIR}" "${PERF_REQUESTS}" "${PERF_CONCURRENCY}" 3

      - name: Upload raw performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-comparison-results
          path: 04_tests/performance/results/ci
          if-no-files-found: error
          retention-days: 14

      - name: Remove performance stack
        if: always()
        run: docker compose -p lumalife-performance down --volumes --remove-orphans
