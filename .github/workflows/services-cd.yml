name: Microservices incremental delivery

on:
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "k8s/services/**"
      - "k8s/healthcheck/**"
      - "scripts/detect-changed-services.sh"
      - "scripts/deploy-services-k8s.sh"
      - ".github/workflows/services-cd.yml"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "k8s/services/**"
      - "k8s/healthcheck/**"
      - "scripts/detect-changed-services.sh"
      - "scripts/deploy-services-k8s.sh"
      - ".github/workflows/services-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: services-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    name: Detect affected services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      has-services: ${{ steps.detect.outputs.has-services }}
      services-csv: ${{ steps.detect.outputs.services-csv }}
    steps:
      - name: Checkout repository with comparison history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select services from changed paths
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            base_sha="${BEFORE_SHA}"
          else
            base_sha="0000000000000000000000000000000000000000"
          fi

          services="$(bash scripts/detect-changed-services.sh "${base_sha}" "${HEAD_SHA}")"
          services_csv="$(jq -r 'join(",")' <<<"${services}")"
          echo "services=${services}" >> "${GITHUB_OUTPUT}"
          echo "services-csv=${services_csv}" >> "${GITHUB_OUTPUT}"
          if [[ "${services}" == "[]" ]]; then
            echo "has-services=false" >> "${GITHUB_OUTPUT}"
          else
            echo "has-services=true" >> "${GITHUB_OUTPUT}"
          fi
          echo "Affected services: ${services}"

      - name: Verify path-selection rules
        run: bash scripts/test-detect-changed-services.sh

  images:
    name: Build ${{ matrix.service }} image
    needs: changes
    if: ${{ needs.changes.outputs.has-services == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate versioned image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/daihao007/lumalife-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Build and optionally publish affected image
        uses: docker/build-push-action@v7
        with:
          context: ./services
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SERVICE_VERSION=sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  kind-smoke:
    name: Smoke test affected services in Kind
    needs: [changes, images]
    if: ${{ needs.changes.outputs.has-services == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create disposable Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: lumalife-services-ci

      - name: Build affected services and single-platform healthcheck image
        shell: bash
        env:
          SERVICES_CSV: ${{ needs.changes.outputs.services-csv }}
        run: |
          image_tag="ci-${GITHUB_SHA::7}"
          IFS=',' read -r -a services <<<"${SERVICES_CSV}"
          for service in "${services[@]}"; do
            docker buildx build \
              --platform linux/amd64 \
              --provenance=false \
              --load \
              --file "services/${service}/Dockerfile" \
              --tag "ghcr.io/daihao007/lumalife-${service}:${image_tag}" \
              services
          done

          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --load \
            --file k8s/healthcheck/Dockerfile \
            --tag "lumalife-healthcheck:${image_tag}" \
            .

      - name: Preload images and verify incremental rollout
        shell: bash
        env:
          SERVICES_CSV: ${{ needs.changes.outputs.services-csv }}
          IMAGE_REGISTRY: ghcr.io/daihao007
        run: |
          image_tag="ci-${GITHUB_SHA::7}"
          IFS=',' read -r -a services <<<"${SERVICES_CSV}"
          images=()
          for service in "${services[@]}"; do
            images+=("ghcr.io/daihao007/lumalife-${service}:${image_tag}")
          done
          images+=("lumalife-healthcheck:${image_tag}")

          kind load docker-image --name lumalife-services-ci "${images[@]}"
          HEALTHCHECK_IMAGE="lumalife-healthcheck:${image_tag}" \
            bash scripts/deploy-services-k8s.sh "${image_tag}" "${services[@]}"

  deploy:
    name: Deploy affected services
    needs: [changes, images, kind-smoke]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.has-services == 'true' }}
    runs-on: ubuntu-latest
    environment: kubernetes
    concurrency:
      group: lumalife-microservices-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4

      - name: Configure cluster credentials
        shell: bash
        env:
          KUBE_CONFIG_BASE64: ${{ secrets.KUBE_CONFIG_BASE64 }}
        run: |
          if [[ -z "${KUBE_CONFIG_BASE64}" ]]; then
            echo "::error::Configure KUBE_CONFIG_BASE64 in the kubernetes environment."
            exit 1
          fi
          kubeconfig="${RUNNER_TEMP}/kubeconfig"
          printf '%s' "${KUBE_CONFIG_BASE64}" | base64 --decode > "${kubeconfig}"
          chmod 600 "${kubeconfig}"
          echo "KUBECONFIG=${kubeconfig}" >> "${GITHUB_ENV}"

      - name: Roll out only affected services and verify probes
        shell: bash
        env:
          SERVICES_CSV: ${{ needs.changes.outputs.services-csv }}
        run: |
          IFS=',' read -r -a services <<<"${SERVICES_CSV}"
          bash scripts/deploy-services-k8s.sh "sha-${GITHUB_SHA::7}" "${services[@]}"
