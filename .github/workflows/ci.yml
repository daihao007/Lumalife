name: Monolith CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      demonstrate_failure_gate:
        description: "故意让质量门禁失败，用于验证失败时不会发布镜像"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: monolith-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  backend-test:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compile and run backend tests
        run: mvn -B -ntp verify

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          if-no-files-found: warn
          retention-days: 7

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  service-skeletons:
    name: Build ${{ matrix.service }} skeleton
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - merchant-service
          - order-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            services/pom.xml
            services/${{ matrix.service }}/pom.xml

      - name: Verify independent service entry and health probes
        run: mvn -B -ntp -f "services/${{ matrix.service }}/pom.xml" verify

  database-schema:
    name: Database schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate isolated test credentials
        shell: bash
        run: |
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "MYSQL_DATABASE=life_assistant" >> "$GITHUB_ENV"
          echo "MYSQL_USER=lifeassist" >> "$GITHUB_ENV"
          echo "MYSQL_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Start MySQL
        run: docker compose up --detach --wait mysql

      - name: Verify repeatable migration and seed lifecycle
        run: |
          docker compose --profile db-tools run --rm db-migrate
          docker compose --profile db-tools run --rm db-migrate
          docker compose --profile db-tools run --rm db-seed
          docker compose --profile db-tools run --rm db-seed
          docker compose --profile db-tools run --rm db-verify
          docker compose --profile db-tools run --rm db-clean
          docker compose --profile db-tools run --rm db-seed
          docker compose --profile db-tools run --rm db-verify

      - name: Export database logs
        if: failure()
        run: docker compose logs --no-color mysql

      - name: Remove test database
        if: always()
        run: docker compose down --volumes --remove-orphans

  compose-stack:
    name: Three-container smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate isolated test credentials
        shell: bash
        run: |
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "MYSQL_DATABASE=life_assistant" >> "$GITHUB_ENV"
          echo "MYSQL_USER=lifeassist" >> "$GITHUB_ENV"
          echo "MYSQL_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Build and start the clean three-container stack
        run: docker compose up --detach --build --wait

      - name: Verify container count, health and automatic database initialization
        shell: bash
        run: |
          mapfile -t running_services < <(docker compose ps --services --status running | sort)
          expected_services=(backend frontend mysql)
          test "${running_services[*]}" = "${expected_services[*]}"
          curl --fail --silent --show-error http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          curl --fail --silent --show-error http://localhost:5173/healthz | grep -q '^ok$'
          curl --fail --silent --show-error http://localhost:5173/actuator/health | grep -q '"status":"UP"'
          docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user="$MYSQL_USER" --database="$MYSQL_DATABASE" --batch --skip-column-names --execute="SELECT COUNT(*) FROM schema_migration WHERE version IN (0x56303031, 0x56303032)"' | grep -qx 2

      - name: Export stack status and logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: Remove clean stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  e2e-test:
    name: API E2E test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run CR-01 to CR-06 API E2E suite
        working-directory: e2e
        run: npm test

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-e2e-reports
          path: e2e/reports
          if-no-files-found: warn
          retention-days: 7

  kubernetes-manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4

      - name: Render Kustomize manifests
        run: kubectl kustomize k8s > "${RUNNER_TEMP}/lumalife-k8s.yaml"

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-manifests
          path: ${{ runner.temp }}/lumalife-k8s.yaml
          if-no-files-found: error
          retention-days: 7

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build
      - service-skeletons
      - database-schema
      - compose-stack
      - e2e-test
      - kubernetes-manifests
    steps:
      - name: Demonstrate the failure gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.demonstrate_failure_gate }}
        run: |
          echo "::error::Manual failure demonstration requested. Image publication and deployment must be skipped."
          exit 1

      - name: Confirm validation passed
        run: echo "All tests, builds and manifest rendering passed. Images may now be built."

  images:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    needs:
      - quality-gate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            image: ghcr.io/daihao007/lumalife-backend
          - component: frontend
            context: ./frontend
            image: ghcr.io/daihao007/lumalife-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
            type=ref,event=pr

      - name: Build and optionally publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  kubernetes-smoke:
    name: Kubernetes rollout smoke test
    runs-on: ubuntu-latest
    needs:
      - images
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create disposable Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: lumalife-ci

      - name: Build images for the disposable cluster
        shell: bash
        run: |
          image_tag="ci-${GITHUB_SHA::7}"
          docker build --tag "lumalife-backend:${image_tag}" backend
          docker build --tag "lumalife-frontend:${image_tag}" frontend
          kind load docker-image --name lumalife-ci \
            "lumalife-backend:${image_tag}" "lumalife-frontend:${image_tag}"

      - name: Deploy and verify probes in the disposable cluster
        shell: bash
        env:
          BACKEND_IMAGE: lumalife-backend
          FRONTEND_IMAGE: lumalife-frontend
        run: bash scripts/deploy-k8s.sh "ci-${GITHUB_SHA::7}"

  kubernetes-deploy:
    name: Deploy Kubernetes
    runs-on: ubuntu-latest
    needs:
      - images
      - kubernetes-smoke
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    environment: kubernetes
    concurrency:
      group: lumalife-kubernetes-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4

      - name: Configure cluster credentials
        shell: bash
        env:
          KUBE_CONFIG_BASE64: ${{ secrets.KUBE_CONFIG_BASE64 }}
        run: |
          if [[ -z "${KUBE_CONFIG_BASE64}" ]]; then
            echo "::error::Configure the KUBE_CONFIG_BASE64 secret in the kubernetes environment."
            exit 1
          fi
          kubeconfig="${RUNNER_TEMP}/kubeconfig"
          printf '%s' "${KUBE_CONFIG_BASE64}" | base64 --decode > "${kubeconfig}"
          chmod 600 "${kubeconfig}"
          echo "KUBECONFIG=${kubeconfig}" >> "${GITHUB_ENV}"

      - name: Deploy versioned images and verify health
        shell: bash
        run: bash scripts/deploy-k8s.sh "sha-${GITHUB_SHA::7}"
