name: Monolith CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      demonstrate_failure_gate:
        description: "故意让质量门禁失败，用于验证失败时不会发布镜像"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: monolith-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  backend-test:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compile and run backend tests
        shell: bash
        run: |
          set +e
          mkdir -p target
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "started_at=$started_at" | tee target/backend-test-raw.log
          echo "command: mvn -B -ntp verify" | tee -a target/backend-test-raw.log
          mvn -B -ntp verify 2>&1 | tee -a target/backend-test-raw.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" | tee -a target/backend-test-raw.log
          echo "completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a target/backend-test-raw.log
          exit "$status"

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/backend-test-raw.log
          if-no-files-found: warn
          retention-days: 7

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run frontend Vitest suite
        shell: bash
        run: |
          set +e
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee vitest-raw.log
          echo "command: npm test" | tee -a vitest-raw.log
          npm test 2>&1 | tee -a vitest-raw.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" | tee -a vitest-raw.log
          echo "completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a vitest-raw.log
          exit "$status"

      - name: Upload frontend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: frontend/vitest-raw.log
          if-no-files-found: warn
          retention-days: 7

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  service-skeletons:
    name: Build ${{ matrix.service }} skeleton
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - merchant-service
          - order-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            services/pom.xml
            services/${{ matrix.service }}/pom.xml

      - name: Verify independent service entry and health probes
        run: mvn -B -ntp -f "services/${{ matrix.service }}/pom.xml" verify

  database-schema:
    name: Database schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate isolated test credentials
        shell: bash
        run: |
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "MYSQL_DATABASE=life_assistant" >> "$GITHUB_ENV"
          echo "MYSQL_USER=lifeassist" >> "$GITHUB_ENV"
          echo "MYSQL_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Start MySQL
        run: docker compose up --detach --wait mysql

      - name: Verify repeatable migration and seed lifecycle
        run: |
          docker compose --profile db-tools run --rm db-migrate
          docker compose --profile db-tools run --rm db-migrate
          docker compose --profile db-tools run --rm db-seed
          docker compose --profile db-tools run --rm db-seed
          docker compose --profile db-tools run --rm db-verify
          docker compose --profile db-tools run --rm db-clean
          docker compose --profile db-tools run --rm db-seed
          docker compose --profile db-tools run --rm db-verify

      - name: Export database logs
        if: failure()
        run: docker compose logs --no-color mysql

      - name: Remove test database
        if: always()
        run: docker compose down --volumes --remove-orphans

  compose-stack:
    name: Three-container smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate isolated test credentials
        shell: bash
        run: |
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "MYSQL_DATABASE=life_assistant" >> "$GITHUB_ENV"
          echo "MYSQL_USER=lifeassist" >> "$GITHUB_ENV"
          echo "MYSQL_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Build and start the clean three-container stack
        run: docker compose up --detach --build --wait

      - name: Seed and backfill service-owned data
        run: |
          docker compose --profile db-tools run --rm db-seed
          docker compose --profile db-tools run --rm db-backfill-services

      - name: Verify container count, health and automatic database initialization
        shell: bash
        run: |
          mapfile -t running_services < <(docker compose ps --services --status running | sort)
          expected_services=(backend frontend identity-service merchant-service mysql order-service)
          test "${running_services[*]}" = "${expected_services[*]}"
          curl --fail --silent --show-error http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          curl --fail --silent --show-error http://localhost:5173/healthz | grep -q '^ok$'
          curl --fail --silent --show-error http://localhost:5173/actuator/health | grep -q '"status":"UP"'
          docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user="$MYSQL_USER" --database="$MYSQL_DATABASE" --batch --skip-column-names --execute="SELECT COUNT(*) FROM schema_migration WHERE version IN (\"V001\",\"V002\",\"V003\",\"V004\",\"V005\",\"V006\",\"V007\",\"V008\",\"V009\",\"V010\",\"V011\",\"V012\")"' | grep -qx 12
          MYSQL_IDENTITY_DATABASE="${MYSQL_IDENTITY_DATABASE:-${MYSQL_DATABASE}_identity}"
          MYSQL_MERCHANT_DATABASE="${MYSQL_MERCHANT_DATABASE:-${MYSQL_DATABASE}_merchant}"
          MYSQL_ORDER_DATABASE="${MYSQL_ORDER_DATABASE:-${MYSQL_DATABASE}_order}"
          mysql_count() {
            local database="$1"
            local query="$2"
            docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user="$MYSQL_USER" --database="$1" --batch --skip-column-names --execute="$2"' sh "$database" "$query" | tr -d '\r'
          }
          test "$(mysql_count "$MYSQL_IDENTITY_DATABASE" "SELECT COUNT(*) FROM schema_migration")" -eq 12
          test "$(mysql_count "$MYSQL_MERCHANT_DATABASE" "SELECT COUNT(*) FROM schema_migration")" -eq 12
          test "$(mysql_count "$MYSQL_ORDER_DATABASE" "SELECT COUNT(*) FROM schema_migration")" -eq 12
          test "$(mysql_count "$MYSQL_IDENTITY_DATABASE" "SELECT COUNT(*) FROM user_account")" -eq 6
          test "$(mysql_count "$MYSQL_MERCHANT_DATABASE" "SELECT COUNT(*) FROM merchant_catalog")" -eq 7

      - name: Verify relational business persistence across backend restart
        shell: bash
        run: |
          set -euxo pipefail
          MYSQL_ORDER_DATABASE="${MYSQL_ORDER_DATABASE:-${MYSQL_DATABASE}_order}"
          mysql_count() {
            local database="$1"
            local query="$2"
            docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user="$MYSQL_USER" --database="$1" --batch --skip-column-names --execute="$2"' sh "$database" "$query" | tr -d '\r'
          }
          login_response=$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"phone":"13800000001","password":"abc123456"}' \
            http://localhost:8080/api/v1/auth/login)
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["token"])' <<< "$login_response")
          direct_order_response=$(curl --silent --show-error --write-out $'\n%{http_code}' \
            -H 'X-Internal-Service-Token: compose-internal-token' \
            -H 'X-User-Id: 1' \
            -H 'Content-Type: application/json' \
            -d '{"quantity":2}' \
            http://localhost:8083/internal/v1/orders/cart/1001)
          echo "Direct order-service cart response:"; echo "$direct_order_response"
          test "$(tail -n 1 <<< "$direct_order_response")" = 200
          backend_cart_response=$(curl --silent --show-error --write-out $'\n%{http_code}' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $token" \
            -d '{"productId":1001,"quantity":2}' \
            http://localhost:8080/api/v1/cart/items)
          echo "Backend cart response:"; echo "$backend_cart_response"
          grep -q '"productId":1001' <<< "$backend_cart_response"
          test "$(tail -n 1 <<< "$backend_cart_response")" = 200

          # The direct request sets quantity to 2; the public add-to-cart endpoint then adds 2 more.
          cart_rows=$(mysql_count "$MYSQL_ORDER_DATABASE" 'SELECT COUNT(*) FROM service_cart_item WHERE user_id=1 AND product_id=1001 AND quantity=4')
          test "$cart_rows" -eq 1
          # The production backend may persist a state snapshot during startup;
          # assert the table is queryable without assuming it stays empty.
          state_rows=$(docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user="$MYSQL_USER" --database="$MYSQL_DATABASE" --batch --skip-column-names --execute="SELECT COUNT(*) FROM business_state"' | tr -d '\r')
          test "$state_rows" -ge 0

          docker compose restart backend
          docker compose up --detach --wait backend
          login_response=$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"phone":"13800000001","password":"abc123456"}' \
            http://localhost:8080/api/v1/auth/login)
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["token"])' <<< "$login_response")
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" \
            http://localhost:8080/api/v1/cart | grep -q '"productId":1001'

      - name: Verify order-service payment idempotency against Compose MySQL
        run: bash scripts/test-order-service-mysql-contract.sh

      - name: Export stack status and logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: Remove clean stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  e2e-test:
    name: API E2E test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run CR-01 to CR-06 API E2E suite
        working-directory: e2e
        shell: bash
        run: |
          set +e
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee ci-e2e-command.log
          echo "command: npm test" | tee -a ci-e2e-command.log
          npm test 2>&1 | tee -a ci-e2e-command.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" | tee -a ci-e2e-command.log
          echo "completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a ci-e2e-command.log
          exit "$status"

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-e2e-reports
          path: |
            e2e/reports
            e2e/ci-e2e-command.log
          if-no-files-found: warn
          retention-days: 7

  failure-injection:
    name: E2E failure injection evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify unavailable backend is reported as an expected failure
        working-directory: e2e
        shell: bash
        run: |
          set +e
          export E2E_START_BACKEND=0
          export E2E_BASE_URL=http://127.0.0.1:65530
          export E2E_TIMEOUT_MS=500
          export E2E_REPORT_DIR=e2e/reports/d05-failure-check
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee ci-failure-injection-raw.log
          echo "command: E2E_START_BACKEND=0 E2E_BASE_URL=$E2E_BASE_URL E2E_TIMEOUT_MS=$E2E_TIMEOUT_MS E2E_REPORT_DIR=$E2E_REPORT_DIR npm test" | tee -a ci-failure-injection-raw.log
          npm test 2>&1 | tee -a ci-failure-injection-raw.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" | tee -a ci-failure-injection-raw.log
          echo "completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a ci-failure-injection-raw.log
          test "$status" -eq 1

      - name: Upload failure injection reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-injection-reports
          path: |
            e2e/reports/d05-failure-check
            e2e/ci-failure-injection-raw.log
          if-no-files-found: warn
          retention-days: 7

  ui-e2e-test:
    name: Real UI E2E test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            ui-e2e/package-lock.json

      - name: Build backend
        run: mvn -B -ntp -f backend/pom.xml package -DskipTests

      - name: Install frontend and UI E2E dependencies
        run: |
          npm ci --no-audit --no-fund --prefix frontend
          npm ci --no-audit --no-fund --prefix ui-e2e
          npm run install:browsers --prefix ui-e2e

      - name: Start backend and frontend
        shell: bash
        run: |
          java -Dlumalife.state-file="${RUNNER_TEMP}/lumalife-ui-state.json" -jar backend/target/lumalife-backend-0.1.0.jar > "${RUNNER_TEMP}/lumalife-backend.log" 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"
          npm run dev --prefix frontend -- --host 127.0.0.1 > "${RUNNER_TEMP}/lumalife-frontend.log" 2>&1 &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null && curl --fail --silent http://127.0.0.1:5173/ >/dev/null && exit 0
            sleep 2
          done
          echo "UI E2E services did not become ready"
          cat "${RUNNER_TEMP}/lumalife-backend.log" || true
          cat "${RUNNER_TEMP}/lumalife-frontend.log" || true
          exit 1

      - name: Run browser scenarios
        run: npm test --prefix ui-e2e

      - name: Upload UI E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-reports
          path: |
            ui-e2e/reports
            ${{ runner.temp }}/lumalife-backend.log
            ${{ runner.temp }}/lumalife-frontend.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop UI E2E services
        if: always()
        shell: bash
        run: kill "${BACKEND_PID:-}" "${FRONTEND_PID:-}" 2>/dev/null || true

  kubernetes-manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4

      - name: Render Kustomize manifests
        run: kubectl kustomize k8s > "${RUNNER_TEMP}/lumalife-k8s.yaml"

      - name: Verify deployment and legacy migration safeguards
        run: |
          bash scripts/test-deploy-k8s.sh
          bash scripts/test-legacy-migrations.sh

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-manifests
          path: ${{ runner.temp }}/lumalife-k8s.yaml
          if-no-files-found: error
          retention-days: 7

      - name: Prepare ECS deployment bundle
        shell: bash
        run: printf '%s\n' "${GITHUB_SHA}" > ecs-source-sha.txt

      - name: Upload ECS deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: ecs-deploy-bundle
          path: |
            ecs-source-sha.txt
            scripts/deploy-k8s.sh
            scripts/lib/legacy-migrations.sh
            k8s
            database/backfill-services.sql
            database/bin
            database/init
            database/migrations
          if-no-files-found: error
          retention-days: 7

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build
      - service-skeletons
      - database-schema
      - compose-stack
      - e2e-test
      - failure-injection
      - ui-e2e-test
      - kubernetes-manifests
    steps:
      - name: Demonstrate the failure gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.demonstrate_failure_gate }}
        run: |
          echo "::error::Manual failure demonstration requested. Image publication and deployment must be skipped."
          exit 1

      - name: Confirm validation passed
        run: echo "All tests, builds and manifest rendering passed. Images may now be built."

  images:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    needs:
      - quality-gate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            image: ghcr.io/daihao007/lumalife-backend
          - component: frontend
            context: ./frontend
            image: ghcr.io/daihao007/lumalife-frontend
          - component: identity-service
            context: ./services
            file: ./services/identity-service/Dockerfile
            image: ghcr.io/daihao007/lumalife-identity-service
          - component: merchant-service
            context: ./services
            file: ./services/merchant-service/Dockerfile
            image: ghcr.io/daihao007/lumalife-merchant-service
          - component: order-service
            context: ./services
            file: ./services/order-service/Dockerfile
            image: ghcr.io/daihao007/lumalife-order-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
            type=ref,event=pr

      - name: Generate runtime version
        id: version
        shell: bash
        run: echo "version=sha-${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"

      - name: Build and optionally publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Verify published image platforms
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          image_tag="sha-${GITHUB_SHA::7}"
          docker buildx imagetools inspect "${{ matrix.image }}:${image_tag}" --raw \
            | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'

  kubernetes-smoke:
    name: Kubernetes rollout smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - images
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create disposable Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: lumalife-ci

      - name: Build images for the disposable cluster
        shell: bash
        run: |
          image_tag="ci-${GITHUB_SHA::7}"
          retry_build() { for attempt in 1 2 3; do "$@" && return 0; echo "build retry ${attempt}"; sleep 10; done; return 1; }
          retry_build docker build --provenance=false --build-arg "SERVICE_VERSION=${image_tag}" --build-arg "GIT_COMMIT=${GITHUB_SHA}" --tag "lumalife-backend:${image_tag}" backend
          retry_build docker build --provenance=false --build-arg "SERVICE_VERSION=${image_tag}" --build-arg "GIT_COMMIT=${GITHUB_SHA}" --tag "lumalife-frontend:${image_tag}" frontend
          retry_build docker build --provenance=false --build-arg "SERVICE_VERSION=${image_tag}" --build-arg "GIT_COMMIT=${GITHUB_SHA}" --tag "lumalife-identity-service:${image_tag}" -f services/identity-service/Dockerfile services
          retry_build docker build --provenance=false --build-arg "SERVICE_VERSION=${image_tag}" --build-arg "GIT_COMMIT=${GITHUB_SHA}" --tag "lumalife-merchant-service:${image_tag}" -f services/merchant-service/Dockerfile services
          retry_build docker build --provenance=false --build-arg "SERVICE_VERSION=${image_tag}" --build-arg "GIT_COMMIT=${GITHUB_SHA}" --tag "lumalife-order-service:${image_tag}" -f services/order-service/Dockerfile services
          kind load docker-image --name lumalife-ci \
            "lumalife-backend:${image_tag}" "lumalife-frontend:${image_tag}" \
            "lumalife-identity-service:${image_tag}" "lumalife-merchant-service:${image_tag}" "lumalife-order-service:${image_tag}"

      - name: Deploy and verify probes in the disposable cluster
        shell: bash
        env:
          BACKEND_IMAGE: lumalife-backend
          FRONTEND_IMAGE: lumalife-frontend
          IDENTITY_IMAGE: lumalife-identity-service
          MERCHANT_IMAGE: lumalife-merchant-service
          ORDER_IMAGE: lumalife-order-service
          ROLLOUT_TIMEOUT: 120s
        run: bash scripts/deploy-k8s.sh "ci-${GITHUB_SHA::7}"

      - name: Exercise deployment failure diagnostics and recovery
        shell: bash
        run: bash scripts/test-deployment-observability-k8s.sh "${RUNNER_TEMP}/d07-deployment-failure"

      - name: Upload deployment failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: d07-deployment-failure-evidence
          path: ${{ runner.temp }}/d07-deployment-failure
          if-no-files-found: warn

  kubernetes-deploy:
    name: Deploy Kubernetes
    # Acceptance deployment: use an isolated hosted Kind cluster so the
    # required check never depends on a campus machine or private kubeconfig.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - images
      - kubernetes-smoke
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    environment: kubernetes
    concurrency:
      group: lumalife-kubernetes-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.37.0

      - name: Create acceptance deployment cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: lumalife

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load published images into the acceptance cluster
        shell: bash
        run: |
          image_tag="sha-${GITHUB_SHA::7}"
          images=(
            "ghcr.io/daihao007/lumalife-backend:${image_tag}"
            "ghcr.io/daihao007/lumalife-frontend:${image_tag}"
            "ghcr.io/daihao007/lumalife-identity-service:${image_tag}"
            "ghcr.io/daihao007/lumalife-merchant-service:${image_tag}"
            "ghcr.io/daihao007/lumalife-order-service:${image_tag}"
          )
          for image in "${images[@]}"; do docker pull "$image"; done
          kind load docker-image --name lumalife "${images[@]}"

      - name: Deploy versioned images and verify health
        shell: bash
        run: bash scripts/deploy-k8s.sh "sha-${GITHUB_SHA::7}"
