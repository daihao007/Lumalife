name: Monolith CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      demonstrate_failure_gate:
        description: "故意让质量门禁失败，用于验证失败时不会发布镜像"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: monolith-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  backend-test:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compile and run backend tests
        run: mvn -B -ntp verify

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          if-no-files-found: warn
          retention-days: 7

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  database-schema:
    name: Database schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate isolated test credentials
        shell: bash
        run: |
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "MYSQL_DATABASE=life_assistant" >> "$GITHUB_ENV"
          echo "MYSQL_USER=lifeassist" >> "$GITHUB_ENV"
          echo "MYSQL_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Start MySQL
        run: docker compose up --detach --wait mysql

      - name: Verify repeatable migration and seed lifecycle
        run: |
          docker compose --profile db-tools run --rm db-migrate
          docker compose --profile db-tools run --rm db-migrate
          docker compose --profile db-tools run --rm db-seed
          docker compose --profile db-tools run --rm db-seed
          docker compose --profile db-tools run --rm db-verify
          docker compose --profile db-tools run --rm db-clean
          docker compose --profile db-tools run --rm db-seed
          docker compose --profile db-tools run --rm db-verify

      - name: Export database logs
        if: failure()
        run: docker compose logs --no-color mysql

      - name: Remove test database
        if: always()
        run: docker compose down --volumes --remove-orphans

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build
      - database-schema
    steps:
      - name: Demonstrate the failure gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.demonstrate_failure_gate }}
        run: |
          echo "::error::Manual failure demonstration requested. Image publication must be skipped."
          exit 1

      - name: Confirm validation passed
        run: echo "Backend tests and frontend build passed. Images may now be built."

  images:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    needs:
      - quality-gate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            image: ghcr.io/daihao007/lumalife-backend
          - component: frontend
            context: ./frontend
            image: ghcr.io/daihao007/lumalife-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr

      - name: Build and optionally publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
