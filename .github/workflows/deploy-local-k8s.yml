name: Deploy Local Kubernetes

on:
  workflow_run:
    workflows:
      - Monolith CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: "要部署的镜像标签；留空时使用 main"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: lumalife-local-kubernetes
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Docker Desktop Kubernetes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on:
      - self-hosted
      - macOS
      - lumalife-k8s
    timeout-minutes: 20
    environment: kubernetes
    env:
      REGISTRY: ghcr.io
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Resolve immutable image tag
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -n "${REQUESTED_TAG}" ]]; then
            image_tag="${REQUESTED_TAG}"
          else
            image_tag="sha-${SOURCE_SHA:0:7}"
          fi
          echo "tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "Deploying image tag ${image_tag}"

      - name: Checkout the validated revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify the local deployment target
        shell: bash
        run: |
          docker info >/dev/null
          kubectl config use-context docker-desktop
          kubectl cluster-info
          kubectl get nodes
          kubectl get node -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' | grep -q $'\tTrue$'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the validated application images
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          images=(
            "ghcr.io/daihao007/lumalife-backend:${IMAGE_TAG}"
            "ghcr.io/daihao007/lumalife-frontend:${IMAGE_TAG}"
            "ghcr.io/daihao007/lumalife-identity-service:${IMAGE_TAG}"
            "ghcr.io/daihao007/lumalife-merchant-service:${IMAGE_TAG}"
            "ghcr.io/daihao007/lumalife-order-service:${IMAGE_TAG}"
          )
          for image in "${images[@]}"; do
            docker pull "${image}"
          done

      - name: Deploy and verify application health
        shell: bash
        env:
          ROLLOUT_TIMEOUT: 300s
        run: bash scripts/deploy-k8s.sh "${{ steps.version.outputs.tag }}"

      - name: Publish deployment summary
        if: always()
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## Docker Desktop Kubernetes deployment"
            echo
            echo "- Image tag: \`${IMAGE_TAG}\`"
            echo "- Git revision: \`${SOURCE_SHA}\`"
            echo "- Runner: \`${RUNNER_NAME}\`"
            echo
            echo '```text'
            kubectl -n lumalife get deployments,statefulsets,pods,services,persistentvolumeclaims -o wide 2>&1 || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
