  <rect x="80" y="250" width="150" height="70" rx="10" class="box"/><text x="155" y="292" text-anchor="middle" class="label">普通用户</text>
  <rect x="310" y="220" width="190" height="75" rx="12" class="accent"/><text x="405" y="265" text-anchor="middle" class="label">注册 / 登录</text>
