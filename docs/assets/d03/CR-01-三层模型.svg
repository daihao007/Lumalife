<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1420" viewBox="0 0 1200 1420">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#64748b}.h{font-size:22px;font-weight:700}.label{font-size:18px}.small{font-size:15px;fill:#475569}.box{fill:#fff;stroke:#64748b;stroke-width:2}.accent{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.domain{fill:#f8fafc;stroke:#475569;stroke-width:2}.line{stroke:#334155;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect width="1200" height="1420" fill="#f8fafc"/>
