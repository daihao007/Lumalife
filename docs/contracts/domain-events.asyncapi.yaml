asyncapi: 2.6.0
id: urn:com:lumalife:domain-events
info:
  title: LumaLife Domain Events
  version: 0.1.0-draft
  description: At-least-once service events for Issue #23. Consumers must deduplicate by eventId.
  contact:
    name: LumaLife project team
    url: https://github.com/daihao007/Lumalife
  license:
    name: Course project - repository terms apply
x-contract-status: draft-2026-08-26
defaultContentType: application/json
servers:
  cluster:
    url: event-bus:9092
    protocol: kafka
    description: Logical cluster endpoint; the concrete infrastructure remains a review item.
tags:
  - name: identity
    description: Identity-owned account events
  - name: merchant
    description: Merchant-owned catalog events
  - name: order
    description: Order-owned payment, lifecycle and review events
channels:
  lumalife.identity.user-registered.v1:
    publish:
      operationId: publishUserRegisteredV1
      message: {$ref: '#/components/messages/UserRegisteredV1'}
  lumalife.identity.user-profile-changed.v1:
    publish:
      operationId: publishUserProfileChangedV1
      message: {$ref: '#/components/messages/UserProfileChangedV1'}
  lumalife.identity.merchant-account-bound.v1:
    publish:
      operationId: publishMerchantAccountBoundV1
      message: {$ref: '#/components/messages/MerchantAccountBoundV1'}
  lumalife.merchant.product-changed.v1:
    publish:
      operationId: publishProductChangedV1
      message: {$ref: '#/components/messages/ProductChangedV1'}
  lumalife.merchant.product-deleted.v1:
    publish:
      operationId: publishProductDeletedV1
      message: {$ref: '#/components/messages/ProductDeletedV1'}
  lumalife.order.order-paid.v1:
    publish:
      operationId: publishOrderPaidV1
      message: {$ref: '#/components/messages/OrderPaidV1'}
  lumalife.order.order-status-changed.v1:
    publish:
      operationId: publishOrderStatusChangedV1
      message: {$ref: '#/components/messages/OrderStatusChangedV1'}
  lumalife.order.review-created.v1:
    publish:
      operationId: publishReviewCreatedV1
      message: {$ref: '#/components/messages/ReviewCreatedV1'}
components:
  messages:
    UserRegisteredV1:
      name: UserRegistered.v1
      messageId: UserRegistered.v1
      title: A user account was committed
      x-producer: identity-service
      x-consumers: [order-service]
      payload: {$ref: '#/components/schemas/UserRegisteredEnvelope'}
    UserProfileChangedV1:
      name: UserProfileChanged.v1
      messageId: UserProfileChanged.v1
      title: A user display profile was changed
      x-producer: identity-service
      x-consumers: [merchant-service, order-service]
      payload: {$ref: '#/components/schemas/UserProfileChangedEnvelope'}
    MerchantAccountBoundV1:
      name: MerchantAccountBound.v1
      messageId: MerchantAccountBound.v1
      title: A merchant administrator account was bound
      x-producer: identity-service
      x-consumers: [merchant-service]
      payload: {$ref: '#/components/schemas/MerchantAccountBoundEnvelope'}
    ProductChangedV1:
      name: ProductChanged.v1
      messageId: ProductChanged.v1
      title: A product snapshot changed
      x-producer: merchant-service
      x-consumers: [order-service]
      payload: {$ref: '#/components/schemas/ProductChangedEnvelope'}
    ProductDeletedV1:
      name: ProductDeleted.v1
      messageId: ProductDeleted.v1
      title: A product was deleted
      x-producer: merchant-service
      x-consumers: [order-service]
      payload: {$ref: '#/components/schemas/ProductDeletedEnvelope'}
    OrderPaidV1:
      name: OrderPaid.v1
      messageId: OrderPaid.v1
      title: Payment was committed; this is the only inventory-confirmation trigger
      x-producer: order-service
      x-consumers: [merchant-service]
      payload: {$ref: '#/components/schemas/OrderPaidEnvelope'}
    OrderStatusChangedV1:
      name: OrderStatusChanged.v1
      messageId: OrderStatusChanged.v1
      title: An order status transition was committed
      x-producer: order-service
      x-consumers: [merchant-service]
      payload: {$ref: '#/components/schemas/OrderStatusChangedEnvelope'}
    ReviewCreatedV1:
      name: ReviewCreated.v1
      messageId: ReviewCreated.v1
      title: A one-per-order review was committed
      x-producer: order-service
      x-consumers: [merchant-service]
      payload: {$ref: '#/components/schemas/ReviewCreatedEnvelope'}
  schemas:
    EventEnvelope:
      type: object
      additionalProperties: false
      required: [eventId, eventType, version, occurredAt, producer, aggregateId, traceId, payload]
      properties:
        eventId: {type: string, format: uuid}
        eventType: {type: string}
        version: {type: integer, minimum: 1}
        occurredAt: {type: string, format: date-time}
        producer: {type: string, enum: [identity-service, merchant-service, order-service]}
        aggregateId: {type: string, minLength: 1}
        traceId: {type: string, minLength: 16, maxLength: 64}
        payload: {type: object}
    UserRegisteredEnvelope:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          properties:
            eventType: {const: UserRegistered}
            version: {const: 1}
            producer: {const: identity-service}
            payload:
              type: object
              additionalProperties: false
              required: [userId, role, registeredAt]
              properties:
                userId: {type: integer, format: int64}
                role: {type: string, enum: [USER, MERCHANT_ADMIN, PLATFORM_ADMIN]}
                registeredAt: {type: string, format: date-time}
    UserProfileChangedEnvelope:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          properties:
            eventType: {const: UserProfileChanged}
            version: {const: 1}
            producer: {const: identity-service}
            payload:
              type: object
              additionalProperties: false
              required: [userId, nickname, changedAt]
              properties:
                userId: {type: integer, format: int64}
                nickname: {type: string, maxLength: 64}
                avatarUrl: {type: [string, 'null']}
                changedAt: {type: string, format: date-time}
    MerchantAccountBoundEnvelope:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          properties:
            eventType: {const: MerchantAccountBound}
            version: {const: 1}
            producer: {const: identity-service}
            payload:
              type: object
              additionalProperties: false
              required: [userId, merchantId, nickname, boundAt]
              properties:
                userId: {type: integer, format: int64}
                merchantId: {type: integer, format: int64}
                nickname: {type: string}
                boundAt: {type: string, format: date-time}
    ProductChangedEnvelope:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          properties:
            eventType: {const: ProductChanged}
            version: {const: 1}
            producer: {const: merchant-service}
            payload:
              type: object
              additionalProperties: false
              required: [productId, merchantId, name, priceCent, listed, version]
              properties:
                productId: {type: integer, format: int64}
                merchantId: {type: integer, format: int64}
                name: {type: string}
                priceCent: {type: integer, format: int64, minimum: 0}
                listed: {type: boolean}
                version: {type: integer, format: int64, minimum: 1}
    ProductDeletedEnvelope:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          properties:
            eventType: {const: ProductDeleted}
            version: {const: 1}
            producer: {const: merchant-service}
            payload:
              type: object
              additionalProperties: false
              required: [productId, merchantId, version, deletedAt]
              properties:
                productId: {type: integer, format: int64}
                merchantId: {type: integer, format: int64}
                version: {type: integer, format: int64, minimum: 1}
                deletedAt: {type: string, format: date-time}
    OrderPaidEnvelope:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          properties:
            eventType: {const: OrderPaid}
            version: {const: 1}
            producer: {const: order-service}
            payload:
              type: object
              additionalProperties: false
              required: [orderId, userId, merchantId, totalCent, paidAt, items]
              properties:
                orderId: {type: integer, format: int64}
                userId: {type: integer, format: int64}
                merchantId: {type: integer, format: int64}
                totalCent: {type: integer, format: int64, minimum: 0}
                paidAt: {type: string, format: date-time}
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [itemType, itemId, quantity, priceCent]
                    properties:
                      itemType: {type: string, enum: [PRODUCT, GROUP_DEAL]}
                      itemId: {type: integer, format: int64}
                      quantity: {type: integer, minimum: 1}
                      priceCent: {type: integer, format: int64, minimum: 0}
    OrderStatusChangedEnvelope:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          properties:
            eventType: {const: OrderStatusChanged}
            version: {const: 1}
            producer: {const: order-service}
            payload:
              type: object
              additionalProperties: false
              required: [orderId, merchantId, from, to, changedAt]
              properties:
                orderId: {type: integer, format: int64}
                merchantId: {type: integer, format: int64}
                from: {$ref: '#/components/schemas/OrderStatus'}
                to: {$ref: '#/components/schemas/OrderStatus'}
                changedAt: {type: string, format: date-time}
    ReviewCreatedEnvelope:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          properties:
            eventType: {const: ReviewCreated}
            version: {const: 1}
            producer: {const: order-service}
            payload:
              type: object
              additionalProperties: false
              required: [reviewId, orderId, merchantId, userName, score, tasteScore, serviceScore, content, createdAt]
              properties:
                reviewId: {type: integer, format: int64}
                orderId: {type: integer, format: int64}
                merchantId: {type: integer, format: int64}
                userName: {type: string}
                score: {type: integer, minimum: 1, maximum: 5}
                tasteScore: {type: integer, minimum: 1, maximum: 5}
                serviceScore: {type: integer, minimum: 1, maximum: 5}
                content: {type: string, minLength: 1, maxLength: 2000}
                createdAt: {type: string, format: date-time}
    OrderStatus:
      type: string
      enum: [PENDING_PAYMENT, PAID, ACCEPTED, DELIVERING, RECEIVED, COMPLETED, USED, EXPIRED, CANCELLED]
