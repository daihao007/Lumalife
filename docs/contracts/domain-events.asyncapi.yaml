asyncapi: 2.6.0
id: urn:com:lumalife:domain-events
info:
  title: LumaLife Domain Events
  version: 0.2.0-draft
  description: At-least-once service and inventory Saga events. Consumers must deduplicate by eventId.
  contact:
    name: LumaLife project team
    url: https://github.com/daihao007/Lumalife
  license:
    name: Course project - repository terms apply
x-contract-status: draft-2026-09-02
defaultContentType: application/json
servers:
  cluster:
    url: amqp://event-bus:5672
    protocol: amqp
    description: RabbitMQ durable topic exchange used by the deployed inventory Saga.
tags:
  - name: identity
    description: Identity-owned account events
  - name: merchant
    description: Merchant-owned catalog events
  - name: order
    description: Order-owned payment, lifecycle and review events
channels:
  lumalife.identity.user-registered.v1:
    publish:
      operationId: publishUserRegisteredV1
      message: {$ref: '#/components/messages/UserRegisteredV1'}
  lumalife.identity.user-profile-changed.v1:
    publish:
      operationId: publishUserProfileChangedV1
      message: {$ref: '#/components/messages/UserProfileChangedV1'}
  lumalife.identity.merchant-account-bound.v1:
    publish:
      operationId: publishMerchantAccountBoundV1
      message: {$ref: '#/components/messages/MerchantAccountBoundV1'}
  lumalife.identity.merchant-registration-requested.v1:
    publish:
      operationId: publishMerchantRegistrationRequestedV1
      message: {$ref: '#/components/messages/MerchantRegistrationRequestedV1'}
  lumalife.merchant.merchant-provisioned.v1:
    publish:
      operationId: publishMerchantProvisionedV1
      message: {$ref: '#/components/messages/MerchantProvisionedV1'}
  lumalife.merchant.merchant-provisioning-failed.v1:
    publish:
      operationId: publishMerchantProvisioningFailedV1
      message: {$ref: '#/components/messages/MerchantProvisioningFailedV1'}
  lumalife.merchant.product-changed.v1:
    publish:
      operationId: publishProductChangedV1
      message: {$ref: '#/components/messages/ProductChangedV1'}
  lumalife.merchant.product-deleted.v1:
    publish:
      operationId: publishProductDeletedV1
      message: {$ref: '#/components/messages/ProductDeletedV1'}
  lumalife.order.order-paid.v1:
    publish:
      operationId: publishOrderPaidV1
      message: {$ref: '#/components/messages/OrderPaidV1'}
  lumalife.order.order-status-changed.v1:
    publish:
      operationId: publishOrderStatusChangedV1
      message: {$ref: '#/components/messages/OrderStatusChangedV1'}
  lumalife.order.review-created.v1:
    publish:
      operationId: publishReviewCreatedV1
      message: {$ref: '#/components/messages/ReviewCreatedV1'}
  inventory.reserve.requested:
    publish:
      operationId: requestInventoryReservation
      message: {$ref: '#/components/messages/InventoryReserveRequestedV1'}
  inventory.confirm.requested:
    publish:
      operationId: confirmInventoryReservation
      message: {$ref: '#/components/messages/InventoryConfirmRequestedV1'}
  inventory.release.requested:
    publish:
      operationId: releaseInventoryReservation
      message: {$ref: '#/components/messages/InventoryReleaseRequestedV1'}
  inventory.result.reserved:
    publish:
      operationId: publishInventoryReservedV1
      message: {$ref: '#/components/messages/InventoryReservedResultV1'}
  inventory.result.confirmed:
    publish:
      operationId: publishInventoryConfirmedV1
      message: {$ref: '#/components/messages/InventoryConfirmedResultV1'}
  inventory.result.released:
    publish:
      operationId: publishInventoryReleasedV1
      message: {$ref: '#/components/messages/InventoryReleasedResultV1'}
  inventory.result.check_required:
    publish:
      operationId: publishInventoryCheckRequiredV1
      message: {$ref: '#/components/messages/InventoryCheckRequiredResultV1'}
  inventory.result.release_failed:
    publish:
      operationId: publishInventoryReleaseFailedV1
      message: {$ref: '#/components/messages/InventoryReleaseFailedResultV1'}
  inventory.result.failed:
    publish:
      operationId: publishInventoryFailedV1
      message: {$ref: '#/components/messages/InventoryFailedResultV1'}
components:
  messages:
    UserRegisteredV1:
      name: UserRegistered.v1
      messageId: UserRegistered.v1
      title: A user account was committed
      x-producer: identity-service
      x-consumers: [order-service]
      payload: {$ref: '#/components/schemas/UserRegisteredEnvelope'}
    UserProfileChangedV1:
      name: UserProfileChanged.v1
      messageId: UserProfileChanged.v1
      title: A user display profile was changed
      x-producer: identity-service
      x-consumers: [merchant-service, order-service]
      payload: {$ref: '#/components/schemas/UserProfileChangedEnvelope'}
    MerchantAccountBoundV1:
      name: MerchantAccountBound.v1
      messageId: MerchantAccountBound.v1
      title: A merchant administrator account was bound
      x-producer: identity-service
      x-consumers: [merchant-service]
      payload: {$ref: '#/components/schemas/MerchantAccountBoundEnvelope'}
    MerchantRegistrationRequestedV1:
      name: MerchantRegistrationRequested.v1
      messageId: MerchantRegistrationRequested.v1
      title: Identity accepted a merchant registration and requested idempotent provisioning
      x-producer: identity-service
      x-consumers: [merchant-service]
      payload: {$ref: '#/components/schemas/MerchantRegistrationRequestedEnvelope'}
    MerchantProvisionedV1:
      name: MerchantProvisioned.v1
      messageId: MerchantProvisioned.v1
      title: Merchant created the requested merchant fact
      x-producer: merchant-service
      x-consumers: [identity-service]
      payload: {$ref: '#/components/schemas/MerchantProvisionedEnvelope'}
    MerchantProvisioningFailedV1:
      name: MerchantProvisioningFailed.v1
      messageId: MerchantProvisioningFailed.v1
      title: Merchant provisioning reached a terminal failure
      x-producer: merchant-service
      x-consumers: [identity-service]
      payload: {$ref: '#/components/schemas/MerchantProvisioningFailedEnvelope'}
    ProductChangedV1:
      name: ProductChanged.v1
      messageId: ProductChanged.v1
      title: A product snapshot changed
      x-producer: merchant-service
      x-consumers: [order-service]
      payload: {$ref: '#/components/schemas/ProductChangedEnvelope'}
    ProductDeletedV1:
      name: ProductDeleted.v1
      messageId: ProductDeleted.v1
      title: A product was deleted
      x-producer: merchant-service
      x-consumers: [order-service]
      payload: {$ref: '#/components/schemas/ProductDeletedEnvelope'}
    OrderPaidV1:
      name: OrderPaid.v1
      messageId: OrderPaid.v1
      title: Payment was committed; this is the only inventory-confirmation trigger
      x-producer: order-service
      x-consumers: [merchant-service]
      payload: {$ref: '#/components/schemas/OrderPaidEnvelope'}
    OrderStatusChangedV1:
      name: OrderStatusChanged.v1
      messageId: OrderStatusChanged.v1
      title: An order status transition was committed
      x-producer: order-service
      x-consumers: [merchant-service]
      payload: {$ref: '#/components/schemas/OrderStatusChangedEnvelope'}
    ReviewCreatedV1:
      name: ReviewCreated.v1
      messageId: ReviewCreated.v1
      title: A one-per-order review was committed
      x-producer: order-service
      x-consumers: [merchant-service]
      payload: {$ref: '#/components/schemas/ReviewCreatedEnvelope'}
    InventoryReserveRequestedV1:
      name: inventory.reserve.requested.v1
      messageId: inventory.reserve.requested.v1
      title: Order requests an idempotent inventory reservation
      x-producer: order-service
      x-consumers: [merchant-service]
      payload: {$ref: '#/components/schemas/InventoryCommandEnvelope'}
    InventoryConfirmRequestedV1:
      name: inventory.confirm.requested.v1
      messageId: inventory.confirm.requested.v1
      title: Order requests confirmation of a reservation
      x-producer: order-service
      x-consumers: [merchant-service]
      payload: {$ref: '#/components/schemas/InventoryCommandEnvelope'}
    InventoryReleaseRequestedV1:
      name: inventory.release.requested.v1
      messageId: inventory.release.requested.v1
      title: Order requests idempotent release or compensation
      x-producer: order-service
      x-consumers: [merchant-service]
      payload: {$ref: '#/components/schemas/InventoryCommandEnvelope'}
    InventoryReservedResultV1:
      name: inventory.result.reserved.v1
      messageId: inventory.result.reserved.v1
      title: Merchant accepted the reservation
      x-producer: merchant-service
      x-consumers: [order-service]
      payload: {$ref: '#/components/schemas/InventoryResultEnvelope'}
    InventoryConfirmedResultV1:
      name: inventory.result.confirmed.v1
      messageId: inventory.result.confirmed.v1
      title: Merchant confirmed the reservation
      x-producer: merchant-service
      x-consumers: [order-service]
      payload: {$ref: '#/components/schemas/InventoryResultEnvelope'}
    InventoryReleasedResultV1:
      name: inventory.result.released.v1
      messageId: inventory.result.released.v1
      title: Inventory was fully restored; order Saga may become RELEASED
      x-producer: merchant-service
      x-consumers: [order-service]
      payload: {$ref: '#/components/schemas/InventoryResultEnvelope'}
    InventoryCheckRequiredResultV1:
      name: inventory.result.check_required.v1
      messageId: inventory.result.check_required.v1
      title: Inventory could not be safely reconciled and needs manual handling
      x-producer: merchant-service
      x-consumers: [order-service]
      payload: {$ref: '#/components/schemas/InventoryResultEnvelope'}
    InventoryReleaseFailedResultV1:
      name: inventory.result.release_failed.v1
      messageId: inventory.result.release_failed.v1
      title: Inventory release failed without a safe automatic conclusion
      x-producer: merchant-service
      x-consumers: [order-service]
      payload: {$ref: '#/components/schemas/InventoryResultEnvelope'}
    InventoryFailedResultV1:
      name: inventory.result.failed.v1
      messageId: inventory.result.failed.v1
      title: Reservation or confirmation command reached a business failure
      x-producer: merchant-service
      x-consumers: [order-service]
      payload: {$ref: '#/components/schemas/InventoryResultEnvelope'}
  schemas:
    EventEnvelope:
      type: object
      additionalProperties: false
      required: [eventId, eventType, version, occurredAt, producer, aggregateId, traceId, payload]
      properties:
        eventId: {type: string, format: uuid}
        eventType: {type: string}
        version: {type: integer, minimum: 1}
        occurredAt: {type: string, format: date-time}
        producer: {type: string, enum: [identity-service, merchant-service, order-service]}
        aggregateId: {type: string, minLength: 1}
        traceId: {type: string, minLength: 16, maxLength: 64}
        payload: {type: object}
    UserRegisteredEnvelope:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          properties:
            eventType: {const: UserRegistered}
            version: {const: 1}
            producer: {const: identity-service}
            payload:
              type: object
              additionalProperties: false
              required: [userId, role, registeredAt]
              properties:
                userId: {type: integer, format: int64}
                role: {type: string, enum: [USER, MERCHANT_ADMIN, PLATFORM_ADMIN]}
                registeredAt: {type: string, format: date-time}
    UserProfileChangedEnvelope:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          properties:
            eventType: {const: UserProfileChanged}
            version: {const: 1}
            producer: {const: identity-service}
            payload:
              type: object
              additionalProperties: false
              required: [userId, nickname, changedAt]
              properties:
                userId: {type: integer, format: int64}
                nickname: {type: string, maxLength: 64}
                avatarUrl: {type: [string, 'null']}
                changedAt: {type: string, format: date-time}
    MerchantAccountBoundEnvelope:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          properties:
            eventType: {const: MerchantAccountBound}
            version: {const: 1}
            producer: {const: identity-service}
            payload:
              type: object
              additionalProperties: false
              required: [registrationId, userId, merchantId, nickname, boundAt]
              properties:
                registrationId: {type: string, format: uuid}
                userId: {type: integer, format: int64}
                merchantId: {type: integer, format: int64}
                nickname: {type: string}
                boundAt: {type: string, format: date-time}
    MerchantRegistrationRequestedEnvelope:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          properties:
            eventType: {const: MerchantRegistrationRequested}
            version: {const: 1}
            producer: {const: identity-service}
            payload:
              type: object
              additionalProperties: false
              required: [registrationId, userId, merchantId, nickname, requestedAt]
              properties:
                registrationId: {type: string, format: uuid}
                userId: {type: integer, format: int64}
                merchantId: {type: integer, format: int64}
                nickname: {type: string, minLength: 1, maxLength: 64}
                requestedAt: {type: string, format: date-time}
    MerchantProvisionedEnvelope:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          properties:
            eventType: {const: MerchantProvisioned}
            version: {const: 1}
            producer: {const: merchant-service}
            payload:
              type: object
              additionalProperties: false
              required: [registrationId, userId, merchantId, provisionedAt]
              properties:
                registrationId: {type: string, format: uuid}
                userId: {type: integer, format: int64}
                merchantId: {type: integer, format: int64}
                provisionedAt: {type: string, format: date-time}
    MerchantProvisioningFailedEnvelope:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          properties:
            eventType: {const: MerchantProvisioningFailed}
            version: {const: 1}
            producer: {const: merchant-service}
            payload:
              type: object
              additionalProperties: false
              required: [registrationId, userId, merchantId, reason, failedAt]
              properties:
                registrationId: {type: string, format: uuid}
                userId: {type: integer, format: int64}
                merchantId: {type: integer, format: int64}
                reason: {type: string, minLength: 1, maxLength: 128}
                failedAt: {type: string, format: date-time}
    ProductChangedEnvelope:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          properties:
            eventType: {const: ProductChanged}
            version: {const: 1}
            producer: {const: merchant-service}
            payload:
              type: object
              additionalProperties: false
              required: [productId, merchantId, name, priceCent, listed, version]
              properties:
                productId: {type: integer, format: int64}
                merchantId: {type: integer, format: int64}
                name: {type: string}
                priceCent: {type: integer, format: int64, minimum: 0}
                listed: {type: boolean}
                version: {type: integer, format: int64, minimum: 1}
    ProductDeletedEnvelope:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          properties:
            eventType: {const: ProductDeleted}
            version: {const: 1}
            producer: {const: merchant-service}
            payload:
              type: object
              additionalProperties: false
              required: [productId, merchantId, version, deletedAt]
              properties:
                productId: {type: integer, format: int64}
                merchantId: {type: integer, format: int64}
                version: {type: integer, format: int64, minimum: 1}
                deletedAt: {type: string, format: date-time}
    OrderPaidEnvelope:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          properties:
            eventType: {const: OrderPaid}
            version: {const: 1}
            producer: {const: order-service}
            payload:
              type: object
              additionalProperties: false
              required: [orderId, userId, merchantId, totalCent, paidAt, items]
              properties:
                orderId: {type: integer, format: int64}
                userId: {type: integer, format: int64}
                merchantId: {type: integer, format: int64}
                totalCent: {type: integer, format: int64, minimum: 0}
                paidAt: {type: string, format: date-time}
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [itemType, itemId, quantity, priceCent]
                    properties:
                      itemType: {type: string, enum: [PRODUCT, GROUP_DEAL]}
                      itemId: {type: integer, format: int64}
                      quantity: {type: integer, minimum: 1}
                      priceCent: {type: integer, format: int64, minimum: 0}
    OrderStatusChangedEnvelope:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          properties:
            eventType: {const: OrderStatusChanged}
            version: {const: 1}
            producer: {const: order-service}
            payload:
              type: object
              additionalProperties: false
              required: [orderId, merchantId, from, to, changedAt]
              properties:
                orderId: {type: integer, format: int64}
                merchantId: {type: integer, format: int64}
                from: {$ref: '#/components/schemas/OrderStatus'}
                to: {$ref: '#/components/schemas/OrderStatus'}
                changedAt: {type: string, format: date-time}
    ReviewCreatedEnvelope:
      allOf:
        - {$ref: '#/components/schemas/EventEnvelope'}
        - type: object
          properties:
            eventType: {const: ReviewCreated}
            version: {const: 1}
            producer: {const: order-service}
            payload:
              type: object
              additionalProperties: false
              required: [reviewId, orderId, merchantId, userName, score, tasteScore, serviceScore, content, createdAt]
              properties:
                reviewId: {type: integer, format: int64}
                orderId: {type: integer, format: int64}
                merchantId: {type: integer, format: int64}
                userName: {type: string}
                score: {type: integer, minimum: 1, maximum: 5}
                tasteScore: {type: integer, minimum: 1, maximum: 5}
                serviceScore: {type: integer, minimum: 1, maximum: 5}
                content: {type: string, minLength: 1, maxLength: 2000}
                createdAt: {type: string, format: date-time}
    InventoryCommandEnvelope:
      type: object
      additionalProperties: false
      required: [eventId, aggregateType, aggregateId, eventType, payload]
      properties:
        eventId: {type: string, minLength: 1, maxLength: 128}
        aggregateType: {const: ORDER}
        aggregateId: {type: integer, format: int64, minimum: 1}
        eventType: {type: string, enum: [inventory.reserve.requested, inventory.confirm.requested, inventory.release.requested]}
        payload: {type: object}
    InventoryResultEnvelope:
      type: object
      additionalProperties: false
      required: [eventId, aggregateType, aggregateId, eventType, payload]
      properties:
        eventId: {type: string, minLength: 1, maxLength: 128}
        aggregateType: {const: ORDER}
        aggregateId: {type: integer, format: int64, minimum: 1}
        eventType: {type: string, enum: [inventory.result.reserved, inventory.result.confirmed, inventory.result.released, inventory.result.check_required, inventory.result.release_failed, inventory.result.failed]}
        payload:
          type: object
          additionalProperties: false
          required: [orderId, reservationStatus, sourceEventId, sourceEventType, outcome, occurredAt]
          properties:
            orderId: {type: integer, format: int64, minimum: 1}
            reservationStatus: {type: string, enum: [RESERVED, CONFIRMED, RELEASED, CHECK_REQUIRED, FAILED]}
            sourceEventId: {type: string, minLength: 1, maxLength: 128}
            sourceEventType: {type: string, minLength: 1, maxLength: 128}
            outcome: {type: string, enum: [RESERVED, CONFIRMED, RELEASED, CHECK_REQUIRED, RELEASE_FAILED, FAILED]}
            error: {type: [string, 'null'], maxLength: 1000}
            occurredAt: {type: string, format: date-time}
    OrderStatus:
      type: string
      enum: [PENDING_PAYMENT, PAID, ACCEPTED, DELIVERING, RECEIVED, COMPLETED, USED, EXPIRED, CANCELLED]
