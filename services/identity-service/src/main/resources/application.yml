server:
  # Kubernetes injects IDENTITY_SERVICE_PORT=tcp://<service-ip>:8081 for
  # service links. Do not use that reserved name as an integer HTTP port.
  port: ${LUMALIFE_IDENTITY_HTTP_PORT:8081}
spring:
  application:
    name: identity-service
lumalife:
  internal:
    service-token: ${LUMALIFE_INTERNAL_SERVICE_TOKEN:}
  identity:
    state-file: ${LUMALIFE_IDENTITY_STATE_FILE:./data/identity-state.json}
management:
  endpoint:
    info:
      enabled: true
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,identityState
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
info:
  service:
    name: identity-service
    version: ${SERVICE_VERSION:dev}
    contract-version: v1
  git:
    commit: ${GIT_COMMIT:unknown}
