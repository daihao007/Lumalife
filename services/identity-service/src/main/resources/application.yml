server:
  port: ${IDENTITY_SERVICE_PORT:8081}
spring:
  application:
    name: identity-service
lumalife:
  internal:
    service-token: ${LUMALIFE_INTERNAL_SERVICE_TOKEN:}
  identity:
    state-file: ${LUMALIFE_IDENTITY_STATE_FILE:./data/identity-state.json}
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
info:
  service:
    name: identity-service
    contract-version: v1
