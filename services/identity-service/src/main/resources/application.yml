server:
  # Kubernetes injects IDENTITY_SERVICE_PORT=tcp://<service-ip>:8081 for
  # service links. Do not use that reserved name as an integer HTTP port.
  port: ${LUMALIFE_IDENTITY_HTTP_PORT:8081}
spring:
  application:
    name: identity-service
lumalife:
  internal:
    service-token: ${LUMALIFE_INTERNAL_SERVICE_TOKEN:}
  identity:
    state-file: ${LUMALIFE_IDENTITY_STATE_FILE:./data/identity-state.json}
    backfill-source-file: ${LUMALIFE_IDENTITY_BACKFILL_SOURCE_FILE:}
    access-token-ttl-seconds: ${LUMALIFE_IDENTITY_ACCESS_TOKEN_TTL_SECONDS:86400}
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
info:
  service:
    name: identity-service
    contract-version: v1
