server:
  port: ${LUMALIFE_IDENTITY_PORT:8081}
spring:
  application:
    name: identity-service
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
info:
  service:
    name: identity-service
    version: ${SERVICE_VERSION:0.1.0}
    contract-version: v1
