server:
  port: ${LUMALIFE_ASSISTANT_HTTP_PORT:8084}
spring:
  application:
    name: assistant-service
lumalife:
  internal:
    service-token: ${LUMALIFE_INTERNAL_SERVICE_TOKEN:}
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
info:
  service:
    name: assistant-service
    version: ${SERVICE_VERSION:0.1.0}
    contract-version: v1
agnes:
  endpoint: ${AGNES_ENDPOINT:https://apihub.agnes-ai.com/v1/chat/completions}
  model: ${AGNES_MODEL:agnes-2.0-flash}
  api-key: ${AGNES_API_KEY:}
