server:
  # Kubernetes reserves MERCHANT_SERVICE_PORT for its service-link URI.
  port: ${LUMALIFE_MERCHANT_HTTP_PORT:8082}
spring:
  application:
    name: merchant-service
lumalife:
  internal:
    service-token: ${LUMALIFE_INTERNAL_SERVICE_TOKEN:}
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
info:
  service:
    name: merchant-service
    contract-version: v1
