server:
  # Kubernetes reserves MERCHANT_SERVICE_PORT for its service-link URI.
  port: ${LUMALIFE_MERCHANT_HTTP_PORT:8082}
spring:
  application:
    name: merchant-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:lumalife}
    password: ${RABBITMQ_PASSWORD:lumalife-ci-password}
  # The default profile intentionally runs with the in-memory demo catalog;
  # production enables the JDBC datasource in application-prod.yml.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
lumalife:
  internal:
    service-token: ${LUMALIFE_INTERNAL_SERVICE_TOKEN:}
  events:
    broker:
      enabled: ${LUMALIFE_EVENTS_BROKER_ENABLED:false}
      exchange: ${LUMALIFE_EVENTS_EXCHANGE:lumalife.events}
      queue: ${LUMALIFE_EVENTS_MERCHANT_QUEUE:merchant-inventory-events}
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
info:
  service:
    name: merchant-service
    version: ${SERVICE_VERSION:0.1.0}
    contract-version: v1
