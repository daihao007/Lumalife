server:
  # Kubernetes reserves ORDER_SERVICE_PORT for its service-link URI.
  port: ${LUMALIFE_ORDER_HTTP_PORT:8083}
spring:
  application:
    name: order-service
lumalife:
  internal:
    service-token: ${LUMALIFE_INTERNAL_SERVICE_TOKEN:}
  services:
    merchant:
      base-url: ${MERCHANT_SERVICE_URL:http://localhost:8082}
  events:
    publisher:
      enabled: ${LUMALIFE_EVENTS_PUBLISHER_ENABLED:false}
      fixed-delay-ms: ${LUMALIFE_EVENTS_PUBLISHER_FIXED_DELAY_MS:5000}
    sink-url: ${LUMALIFE_EVENTS_SINK_URL:}
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
info:
  service:
    name: order-service
    version: ${SERVICE_VERSION:0.1.0}
    contract-version: v1
