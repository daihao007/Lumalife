server:
  port: ${ORDER_SERVICE_PORT:8083}
spring:
  application:
    name: order-service
lumalife:
  internal:
    service-token: ${LUMALIFE_INTERNAL_SERVICE_TOKEN:}
management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          enabled: true
          include: livenessState
        readiness:
          enabled: true
          include: readinessState
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
info:
  service:
    name: order-service
    contract-version: v1
