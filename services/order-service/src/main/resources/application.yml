server:
  # Kubernetes reserves ORDER_SERVICE_PORT for its service-link URI.
  port: ${LUMALIFE_ORDER_HTTP_PORT:8083}
spring:
  application:
    name: order-service
lumalife:
  internal:
    service-token: ${LUMALIFE_INTERNAL_SERVICE_TOKEN:}
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
info:
  service:
    name: order-service
    version: ${SERVICE_VERSION:0.1.0}
    contract-version: v1
